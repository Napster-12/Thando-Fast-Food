<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      background: #f9fafb;
    }
    .dashboard-header h1 {
      font-weight: bold;
      background: linear-gradient(90deg, #ffb400, #ff6600);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      border-radius: 12px;
      border: none;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.05);
      transition: 0.3s;
    }
    .card:hover {
      box-shadow: 0px 6px 16px rgba(0,0,0,0.1);
    }
    .badge-stock {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .badge-stock.in-stock { background: #d1fae5; color: #065f46; }
    .badge-stock.low-stock { background: #fef3c7; color: #92400e; }
    .badge-stock.out-of-stock { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="dashboard-header text-center py-4">
    <h1 class="display-6">Spice Stock Scanner</h1>
    <p class="text-muted">Manage your spice inventory with barcode scanning</p>
  </div>

  <div class="container my-5">

    <!-- Quick Actions -->
    <div class="d-flex flex-wrap justify-content-center gap-3 mb-4">
      <button class="btn btn-warning btn-lg">
        <i class="bi bi-upc-scan me-2"></i> Scan Barcode
      </button>
      <button class="btn btn-outline-secondary btn-lg">
        <i class="bi bi-plus-circle me-2"></i> Add Product
      </button>
    </div>

    <!-- Manual Barcode Entry -->
    <div class="card mb-4">
      <div class="card-header fw-bold">
        <i class="bi bi-qr-code me-2"></i> Manual Barcode Entry
      </div>
      <div class="card-body">
        <form class="d-flex gap-2">
          <input type="text" class="form-control" placeholder="Enter barcode manually...">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-search me-1"></i> Process
          </button>
        </form>
      </div>
    </div>

    <!-- Statistics -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <p class="text-muted small">Total Products</p>
            <h3>120</h3>
            <i class="bi bi-box-seam text-primary fs-3"></i>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <p class="text-muted small">Low Stock</p>
            <h3 class="text-warning">15</h3>
            <i class="bi bi-graph-down text-warning fs-3"></i>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <p class="text-muted small">Out of Stock</p>
            <h3 class="text-danger">7</h3>
            <i class="bi bi-exclamation-triangle text-danger fs-3"></i>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <p class="text-muted small">In Stock</p>
            <h3 class="text-success">98</h3>
            <i class="bi bi-graph-up text-success fs-3"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="mb-4">
      <div class="position-relative mx-auto" style="max-width: 400px;">
        <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
        <input type="text" class="form-control ps-5" placeholder="Search products...">
      </div>
    </div>

    <!-- Products Grid -->
    <div class="row g-4">
      <!-- Example Product -->
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <h5 class="card-title mb-1">Chicken Spice</h5>
                <p class="text-muted small mb-0">Fresh ground chicken spice mix</p>
              </div>
              <span class="badge-stock in-stock">Stock</span>
            </div>
            <ul class="list-unstyled small">
              <li><strong>Barcode:</strong> 123456789</li>
              <li><strong>Stock:</strong> <span class="text-success">20 packs</span></li>
              <li><strong>Price:</strong> R25.00</li>
            </ul>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-secondary flex-fill">
                <i class="bi bi-pencil-square me-1"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-secondary flex-fill">
                <i class="bi bi-box-seam me-1"></i> Stock
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Copy more product cards as needed -->
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
