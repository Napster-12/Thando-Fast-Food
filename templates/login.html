{% extends "base.html" %}
{% block title %}Staff Login — {{ store.name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="tf-card p-4 p-lg-5 mx-auto" style="max-width:420px">
    <div class="feature-icon mb-3"><i class="bi bi-lock"></i></div>
    <h1 class="h3">Staff login</h1>
    <p class="text-tf-muted">Sign in to manage orders, bookings and stock.</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="alert alert-danger py-2">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label for="password" class="form-label fw-semibold">Password</label>
      <input type="password" class="form-control mb-3" id="password" name="password" required autofocus autocomplete="current-password">
      <button class="btn btn-tf w-100">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
