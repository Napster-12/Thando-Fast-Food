<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Store Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <style>
    :root{
      --brand: #ffb400; /* matches your menu page accent */
      --brand-2: #ff8a00;
      --chat-bg: #fffdf7;
    }
    body { background:#f9fafb; }
    /* Floating button */
    .chatbot-toggle {
      position: fixed; right: 20px; bottom: 20px; z-index: 1050;
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff; display:flex; align-items:center; justify-content:center;
      box-shadow: 0 10px 25px rgba(0,0,0,.15); border:0;
    }
    .chatbot-toggle:active { transform: translateY(1px); }

    /* Chat window */
    .chatbot-window {
      position: fixed; right: 20px; bottom: 90px; z-index: 1050;
      width: 360px; max-width: calc(100vw - 40px);
      background:#fff; border-radius:16px; overflow:hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,.15); display:none;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .chatbot-header {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff; padding:.9rem 1rem;
      display:flex; align-items:center; justify-content:space-between;
    }
    .chatbot-header .title { font-weight: 700; }
    .chatbot-body {
      background: var(--chat-bg);
      max-height: 60vh; overflow:auto; padding: 12px;
    }
    .msg {
      display:flex; margin: 10px 0;
    }
    .msg.bot .bubble{
      background:#ffffff; color:#222; border:1px solid rgba(0,0,0,0.06);
      border-radius: 12px 12px 12px 4px; padding:10px 12px; max-width: 80%;
      box-shadow: 0 4px 10px rgba(0,0,0,.03);
    }
    .msg.user { justify-content:flex-end; }
    .msg.user .bubble{
      background:linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff; border-radius:12px 12px 4px 12px; padding:10px 12px; max-width:80%;
    }
    .time {
      font-size: .72rem; color:#999; margin-top: 2px;
    }
    .typing {
      display:inline-block; min-width: 38px;
    }
    .typing .dot{
      height:6px; width:6px; background:#bbb; border-radius:50%;
      display:inline-block; margin:0 1px; animation: blink 1.2s infinite;
    }
    .typing .dot:nth-child(2){ animation-delay: .15s; }
    .typing .dot:nth-child(3){ animation-delay: .3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
    .quick-replies {
      display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px;
    }
    .quick-reply {
      background:#fff; border:1px solid rgba(0,0,0,0.08); color:#333;
      border-radius:20px; padding:6px 10px; font-size:.85rem; cursor:pointer;
    }
    .chatbot-footer {
      border-top:1px solid rgba(0,0,0,0.06); background:#fff; padding:10px;
    }
    .btn-brand {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff; border:0;
    }
    .btn-brand:hover { filter: brightness(.95); color:#fff; }
    .badge-pill {
      border-radius: 999px; padding: .35rem .6rem;
    }
  </style>
</head>
<body>

  <!-- Optional page header (kept minimal to fit your site) -->
  <header class="py-3 bg-white border-bottom mb-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/" class="text-decoration-none text-dark">
  <i class="bi bi-arrow-left me-2"></i>Back to Store
</a>

      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-warning text-dark badge-pill">Live</span>
        <strong>Store Chatbot</strong>
      </div>
    </div>
  </header>

  <!-- Page content (placeholder) -->
  <main class="container mb-5">
    <div class="alert alert-light border d-flex align-items-center">
      <i class="bi bi-chat-dots me-2"></i>
      Need help? Use the chat bubble at the bottom-right.
    </div>
  </main>

  <!-- Floating Chat Toggle -->
  <button id="chatToggle" class="chatbot-toggle" aria-label="Open Chat">
    <i class="bi bi-chat-text fs-4"></i>
  </button>

  <!-- Chat Window -->
  <div id="chatWindow" class="chatbot-window" role="dialog" aria-label="Store Chatbot">
    <div class="chatbot-header">
      <div>
        <div class="title">LAS VEGAS 24/7 Assistant</div>
        <small class="opacity-75">Instant answers • Orders • Bookings</small>
      </div>
      <div>
        <button class="btn btn-sm btn-light" id="clearChat" title="Clear conversation">
          <i class="bi bi-trash3"></i>
        </button>
        <button class="btn btn-sm btn-light ms-1" id="minChat" title="Minimize">
          <i class="bi bi-dash"></i>
        </button>
      </div>
    </div>

    <div id="chatBody" class="chatbot-body"></div>

    <div class="chatbot-footer">
      <div id="quickReplies" class="quick-replies"></div>
      <form id="chatForm" class="d-flex gap-2">
        <input id="chatInput" type="text" class="form-control" placeholder="Type a message… (e.g. 'menu', 'hours', 'track order')" autocomplete="off">
        <button class="btn btn-brand"><i class="bi bi-send"></i></button>
      </form>
      <div class="d-flex justify-content-between mt-1">
        <small class="text-muted">
          <i class="bi bi-shield-check me-1"></i>We never ask for your password.
        </small>
        <a href="tel:+27-000-0000" class="small text-muted text-decoration-none">
          <i class="bi bi-telephone me-1"></i>Call us
        </a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chatbot Logic -->
  <script>
    /***************
     * CONFIG / KB *
     ***************/
    const BOT_NAME = "LAS VEGAS 24/7 Assistant";
    const STORAGE_KEY = "lasvegas_chat_v1";

    // Knowledge base & intents (edit to suit your store)
    const BOT_KB = {
      store: {
        name: "Las Vegas",
        phone: "+27 65 636 9815",
        address: "JOHN 4, GUMBANI VILLAGE",
        hours: "Mon–Sat 9:00–20:00, Sun 10:00–18:00",
      },
      menus: [
        { name: "CHICKEN BURGER", price: 44.99, desc: "Grilled chicken, fresh toppings" },
        { name: "CHICKEN PLATE", price: 100.00, desc: "Grilled chicken with salad" },
        { name: "SKHAMBANE", price: 45.00, desc: "Burger, chips, Russian, cheese, cucumber" },
        { name: "MOGODU PLATE", price: 65.00, desc: "Traditional mogodu meal" },
        { name: "STEAK & WORS PLATE", price: 100.00, desc: "Hearty African plate" },
        { name: "SKOPO PLATE", price: 80.00, desc: "Traditional skopo dish" },
        { name: "EXTRA PAP", price: 10.00, desc: "Tsonga delicious pap" },
        { name: "COKE 500ml", price: 15.00, desc: "Cold & refreshing" }
      ],
      faqs: [
        { q: ["hours", "open", "closing"], a: () => `We're open ${BOT_KB.store.hours}.` },
        { q: ["address", "location", "where"], a: () => `Find us at ${BOT_KB.store.address}.` },
        { q: ["phone", "call", "contact", "whatsapp"], a: () => `You can call us at ${BOT_KB.store.phone}.` },
        { q: ["menu", "price", "food", "meal"], a: () => renderMenuList() },
        { q: ["order", "track", "status"], a: () => "Sure, send your order number (e.g. SP-12345)."},
        { q: ["booking", "reserve", "table"], a: () => "To book, please share your name, date, time, and party size." },
        { q: ["help", "human", "agent"], a: () => "I'll connect you. Please leave your name & number, and a staff member will respond shortly." },
        { q: ["pay", "payment"], a: () => "We accept cash, card, and most popular mobile payments." }
      ]
    };

    const QUICK_SUGGESTIONS = [
      "Show menu",
      "What are your hours?",
      "Track order",
      "Location",
      "Talk to a human"
    ];

    /*****************
     * UI ELEMENTS   *
     *****************/
    const chatToggle = document.getElementById("chatToggle");
    const chatWindow = document.getElementById("chatWindow");
    const chatBody   = document.getElementById("chatBody");
    const chatForm   = document.getElementById("chatForm");
    const chatInput  = document.getElementById("chatInput");
    const minChatBtn = document.getElementById("minChat");
    const clearBtn   = document.getElementById("clearChat");
    const quickWrap  = document.getElementById("quickReplies");

    /*****************
     * STATE / INIT  *
     *****************/
    let history = loadHistory();

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }
    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function nowTime() {
      const d = new Date();
      return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    }

    function renderMenuList() {
      return (
        "Here are some popular items:\n" +
        BOT_KB.menus.map(m => `• ${m.name} – R${m.price.toFixed(2)}\n  ${m.desc}`).join("\n")
      );
    }

    function renderQuickReplies() {
      quickWrap.innerHTML = "";
      QUICK_SUGGESTIONS.forEach(text => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-reply";
        btn.textContent = text;
        btn.addEventListener("click", () => handleUserMessage(text));
        quickWrap.appendChild(btn);
      });
    }

    function addMessage(role, text, rawHTML=false) {
      const wrap = document.createElement("div");
      wrap.className = `msg ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (rawHTML) { bubble.innerHTML = text; }
      else {
        bubble.innerText = text;
        // newlines -> <br>
        bubble.innerHTML = bubble.innerHTML.replace(/\n/g, "<br>");
      }
      wrap.appendChild(bubble);

      const meta = document.createElement("div");
      meta.className = "w-100";
      const tm = document.createElement("div");
      tm.className = "time";
      tm.textContent = nowTime();
      wrap.appendChild(tm);

      chatBody.appendChild(wrap);
      history.push({ role, text, t: Date.now() });
      saveHistory();
      scrollToBottom();
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.id = "typing";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
      wrap.appendChild(bubble);
      chatBody.appendChild(wrap);
      scrollToBottom();
    }
    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function openChat() {
      chatWindow.style.display = "block";
      chatToggle.style.display = "none";
      if (!history.length) {
        // First-time greeting
        addMessage("bot",
          `Hi! I'm ${BOT_NAME}. I can help with hours, menu & prices, order tracking, and bookings.\n\nTry: "Show menu", "Track order", or "Location".`
        );
      } else {
        // Repaint previous messages
        chatBody.innerHTML = "";
        history.forEach(m => addMessage(m.role, m.text));
      }
      renderQuickReplies();
    }
    function closeChat() {
      chatWindow.style.display = "none";
      chatToggle.style.display = "flex";
    }

    /*****************
     * AUTOMATION    *
     *****************/
    function classifyIntent(message) {
      const msg = message.toLowerCase();

      // Order number pattern (simple)
      const orderMatch = msg.match(/\b(sp[- ]?\d{4,6})\b/i);
      if (orderMatch) {
        return { type: "order-number", payload: orderMatch[1].toUpperCase() };
      }

      // Keyword-based intents
      for (const f of BOT_KB.faqs) {
        if (f.q.some(k => msg.includes(k))) {
          return { type: "faq", answer: f.a };
        }
      }

      // Menu item query (e.g., "price chicken burger")
      const menuHit = BOT_KB.menus.find(m => msg.includes(m.name.toLowerCase()));
      if (menuHit) {
        return { type: "menu-item", item: menuHit };
      }

      // Greetings
      if (/\b(hi|hello|hey|morning|afternoon|evening)\b/.test(msg)) {
        return { type: "greet" };
      }

      // Fallback
      return { type: "fallback" };
    }

    function handleAutomation(intent, message) {
      switch (intent.type) {
        case "greet":
          return `Hello! How can I help today?\n• Menu & prices\n• Track order\n• Bookings\n• Hours & location`;

        case "faq":
          return intent.answer();

        case "menu-item":
          return `${intent.item.name} costs R${intent.item.price.toFixed(2)}.\n${intent.item.desc}`;

        case "order-number": {
          // Mock order tracker (replace with real fetch to your API later)
          const est = Math.floor(Math.random()*25)+5; // random ETA 5–30
          return `Order ${intent.payload} found ✅\nStatus: Preparing • ETA ${est} minutes.\nReply "notify me" to get a call when it’s ready.`;
        }

        case "fallback":
        default:
          return `I’m not sure yet—try phrases like "menu", "hours", "track order", "booking", or "location".`;
      }
    }

    function handleUserMessage(text) {
      const msg = text.trim();
      if (!msg) return;

      addMessage("user", msg);
      addTyping();

      // Simulate thinking delay
      setTimeout(() => {
        removeTyping();
        const intent = classifyIntent(msg);
        const reply = handleAutomation(intent, msg);
        addMessage("bot", reply);

        // Suggest quick replies contextually
        if (intent.type === "faq" && reply.toLowerCase().includes("open")) {
          setTimeout(() => suggest(["Show menu", "Track order"]), 50);
        } else if (intent.type === "order-number") {
          setTimeout(() => suggest(["Talk to a human", "Location"]), 50);
        } else if (intent.type === "fallback") {
          setTimeout(() => suggest(["Show menu", "What are your hours?"]), 50);
        }
      }, 500 + Math.random()*400);
    }

    function suggest(list) {
      quickWrap.innerHTML = "";
      list.forEach(t => {
        const b = document.createElement("button");
        b.className = "quick-reply";
        b.textContent = t;
        b.onclick = () => handleUserMessage(t);
        quickWrap.appendChild(b);
      });
    }

    /*****************
     * EVENTS        *
     *****************/
    chatToggle.addEventListener("click", openChat);
    minChatBtn.addEventListener("click", closeChat);
    clearBtn.addEventListener("click", () => {
      history = [];
      saveHistory();
      chatBody.innerHTML = "";
      addMessage("bot", "Conversation cleared. How can I help?");
      renderQuickReplies();
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      handleUserMessage(chatInput.value);
      chatInput.value = "";
      chatInput.focus();
    });

    // Open chat automatically on first load (optional)
    // openChat();

    // If you want to deep link: ?openChat=1
    const params = new URLSearchParams(location.search);
    if (params.get("openChat") === "1") openChat();
  </script>
</body>
</html>
