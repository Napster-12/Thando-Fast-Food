<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      background: #f9fafb;
    }
    .dashboard-header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .dashboard-header h1 {
      font-weight: bold;
      background: linear-gradient(90deg, #ffb400, #ff6600);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tab-pane {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="dashboard-header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <a href="/" class="btn btn-sm btn-outline-secondary me-2">
          <i class="bi bi-arrow-left"></i> Back to Store
        </a>
        <a href="/management" class="btn btn-sm btn-outline-primary">Inventory Dashboard</a>
      </div>
      <div class="d-flex align-items-center">
        <div class="me-3 text-end">
          <h1 class="h4 mb-0">Admin Dashboard</h1>
          <p class="text-muted small">Manage your spice palace operations</p>
        </div>
        <a href="logout.html" class="btn btn-sm btn-outline-danger">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="container my-5">
    <ul class="nav nav-tabs nav-fill" id="dashboardTabs" role="tablist">
    
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button" role="tab">
          Orders
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="bookings-tab" data-bs-toggle="tab" data-bs-target="#bookings" type="button" role="tab">
          Bookings
        </button>
      </li>
    </ul>

    <div class="tab-content p-4 bg-white shadow-sm rounded-bottom" id="dashboardTabsContent">
      

      <!-- Orders Tab -->
      <div class="tab-pane fade" id="orders" role="tabpanel">
        <h5>Order Management</h5>
        <p class="text-muted">Here you can view and manage customer orders.</p>
        <!-- Placeholder content -->
        <div class="alert alert-info">Order management content goes here.</div>
      </div>

      <!-- Bookings Tab -->
      <div class="tab-pane fade" id="bookings" role="tabpanel">
        <h5>Booking Management</h5>
        <p class="text-muted">Here you can manage customer bookings.</p>
        <!-- Placeholder content -->
        <div class="alert alert-success">Booking management content goes here.</div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
